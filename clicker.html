<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouzouc Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/clicker.css">
</head>
<body>
  <!-- Fond briques de verre et réfraction lumineuse -->
  <div class="glass-chamber"></div>
  <div class="light-beams"></div>

  <!-- RÉSEAU DE CONVOYEURS / TAPIS ROULANTS EN ARRIÈRE-PLAN -->
  <div class="conveyor-network" aria-hidden="true">
    <div class="conveyor-lane lane-left">
      <div class="belt-ribs"></div>
      <div id="lane-track-1" class="lane-track"></div>
    </div>
    <div class="conveyor-lane lane-mid">
      <div class="belt-ribs"></div>
      <div id="lane-track-2" class="lane-track"></div>
    </div>
    <div class="conveyor-lane lane-right">
      <div class="belt-ribs"></div>
      <div id="lane-track-3" class="lane-track"></div>
    </div>
  </div>

  <!-- INTERFACE PRINCIPALE -->
  <div class="app-layout">
    <header class="masthead">
      <div class="kicker">MANUFACTURE D'ÉMERAUDE</div>
      <h1>BOUZOUC CLICKER</h1>
      <p class="subtitle">Façonnez le verre taillé et approvisionnez les lignes de montage.</p>
    </header>

    <main class="forge">
      <div class="meter">
        <div id="counter" class="count">0</div>
        <div class="unit">Zoucs extraits</div>
        <div id="passive-rate" class="rate">0,0 / sec</div>
      </div>

      <!-- Carreau central façon bloc de verre biseauté -->
      <div class="tile-block">
        <div class="tile-highlight"></div>
        <button id="bouzouc" class="bouzouc-btn" aria-label="Frapper le Bouzouc"></button>
      </div>
    </main>

    <footer class="bazaar">
      <div class="bazaar-header">
        <h2>Lignes de Production</h2>
        <span class="sub-lead">Modules convoyés</span>
      </div>

      <div class="catalog">
        <button id="buy-click1" class="merch" disabled>
          <div class="merch-meta">
            <span class="merch-name">Burin de Faïencier</span>
            <span class="merch-gain">+1 Zouc / frappe</span>
          </div>
          <div class="merch-deal">
            <span id="cost-click1" class="price">15</span>
            <span id="qty-click1" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-auto1" class="merch" disabled>
          <div class="merch-meta">
            <span class="merch-name">Robot Zouc Mk.I</span>
            <span class="merch-gain">+1 Zouc / sec</span>
          </div>
          <div class="merch-deal">
            <span id="cost-auto1" class="price">30</span>
            <span id="qty-auto1" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-click2" class="merch" disabled>
          <div class="merch-meta">
            <span class="merch-name">Presse Émaillée</span>
            <span class="merch-gain">+4 Zoucs / frappe</span>
          </div>
          <div class="merch-deal">
            <span id="cost-click2" class="price">120</span>
            <span id="qty-click2" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-auto2" class="merch" disabled>
          <div class="merch-meta">
            <span class="merch-name">Peloton Mécanique</span>
            <span class="merch-gain">+8 Zoucs / sec</span>
          </div>
          <div class="merch-deal">
            <span id="cost-auto2" class="price">350</span>
            <span id="qty-auto2" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-click3" class="merch" disabled>
          <div class="merch-meta">
            <span class="merch-name">Creuset de Quartz</span>
            <span class="merch-gain">+20 Zoucs / frappe</span>
          </div>
          <div class="merch-deal">
            <span id="cost-click3" class="price">1 000</span>
            <span id="qty-click3" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-auto3" class="merch" disabled>
          <div class="merch-meta">
            <span class="merch-name">Haut-Fourneau Sacré</span>
            <span class="merch-gain">+50 Zoucs / sec</span>
          </div>
          <div class="merch-deal">
            <span id="cost-auto3" class="price">3 200</span>
            <span id="qty-auto3" class="owned">x0</span>
          </div>
        </button>
      </div>
    </footer>
  </div>

  <script src="JavaScript/script.js"></script>
</body>
</html>
