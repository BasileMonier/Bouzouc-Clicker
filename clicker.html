<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouzouc Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/clicker.css">
</head>
<body>

  <div class="glow"></div>

  <main class="game-box">
    <h1>Bouzouc Clicker</h1>
    <p>Bienvenue dans le Bouzouc Clicker ! 
      Appuie sur le Bouzouc au milieu, à force de cliquer tu vas pouvoir avoir acheter des bonus et avoir accés à des récompenses !</p>
    <div class="counter-box">
      <div id="counter" class="counter">0</div>
      <div class="counter-label">Zouc Récupérés</div>
    </div>

    <!-- Tête cliquable -->
    <button id="kante" class="kante-btn" aria-label="Cliquer sur Kanté"></button>

    <!-- Message évolutif -->
    <div id="status" class="status-badge">
      Clique vite !
    </div>
  </main>

  <script src="JavaScript/script.js"></script>
</body>
</html>
