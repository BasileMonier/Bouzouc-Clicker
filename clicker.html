<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouzouc Clicker - Pixel Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/clicker.css">
</head>
<body>

  <!-- CIEL DU SOIR VOXEL -->
  <div class="voxel-world">
    <!-- Soleil cubique -->
    <div class="pixel-sun"></div>

    <!-- Nuages cubiques étagés -->
    <div class="pixel-cloud cloud-1"></div>
    <div class="pixel-cloud cloud-2"></div>

    <!-- Oiseaux carrés -->
    <div id="pixel-birds" class="pixel-birds"></div>

    <!-- Montagnes & Collines en blocs -->
    <div class="mountain-layer distant"></div>
    <div class="mountain-layer near"></div>

    <!-- Piste de rails complète d'un bord à l'autre -->
    <div class="minecart-track">
      <div class="rail-ties"></div>
      <div class="iron-rails"></div>
      <!-- Wagonnets animés -->
      <div id="cart-container" class="cart-container"></div>
    </div>

    <!-- Sol d'herbe cubique -->
    <div class="grass-ground">
      <div class="pixel-sheep"></div>
    </div>
  </div>

  <!-- INTERFACE DE JEU EN PIXELS -->
  <div class="ui-layer">
    <header class="game-header">
      <div class="kicker">BOUZOUC CRAFT</div>
      <h1>BOUZOUC CLICKER</h1>
      <p class="subtitle">Mine l'émeraude sacrée et équipe ta manufacture cubique.</p>
    </header>

    <main class="mining-zone">
      <div class="pixel-scoreboard">
        <div id="counter" class="count">0</div>
        <div class="unit">ZOUCS MINÉS</div>
        <div id="passive-rate" class="rate">+0 / SEC</div>
      </div>

      <!-- BLOC D'ÉMERAUDE CUBIQUE FAÇON MINECRAFT -->
      <div class="emerald-voxel-wrapper">
        <button id="bouzouc" class="emerald-voxel-btn" aria-label="Miner le bloc d'émeraude">
          <div class="voxel-face top"></div>
          <div class="voxel-face front"></div>
        </button>
      </div>
    </main>

    <!-- BOUTIQUE D'AMÉLIORATIONS FAÇON INVENTAIRE -->
    <footer class="inventory-bazaar">
      <div class="inventory-title">
        <span>[ INVENTAIRE D'ATELIER ]</span>
        <span class="sub">FORGE DE BLOCS</span>
      </div>

      <div class="catalog">
        <button id="buy-click1" class="merch-slot" disabled>
          <div class="slot-info">
            <span class="slot-name">Pioche en Bois</span>
            <span class="slot-gain">+1 / clic</span>
          </div>
          <div class="slot-deal">
            <span id="cost-click1" class="price">15</span>
            <span id="qty-click1" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-auto1" class="merch-slot" disabled>
          <div class="slot-info">
            <span class="slot-name">Golem Ouvrier</span>
            <span class="slot-gain">+1 / sec</span>
          </div>
          <div class="slot-deal">
            <span id="cost-auto1" class="price">30</span>
            <span id="qty-auto1" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-click2" class="merch-slot" disabled>
          <div class="slot-info">
            <span class="slot-name">Pioche en Fer</span>
            <span class="slot-gain">+5 / clic</span>
          </div>
          <div class="slot-deal">
            <span id="cost-click2" class="price">120</span>
            <span id="qty-click2" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-auto2" class="merch-slot" disabled>
          <div class="slot-info">
            <span class="slot-name">Fourneau Rouge</span>
            <span class="slot-gain">+12 / sec</span>
          </div>
          <div class="slot-deal">
            <span id="cost-auto2" class="price">400</span>
            <span id="qty-auto2" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-click3" class="merch-slot" disabled>
          <div class="slot-info">
            <span class="slot-name">Pioche Diamant</span>
            <span class="slot-gain">+35 / clic</span>
          </div>
          <div class="slot-deal">
            <span id="cost-click3" class="price">1 500</span>
            <span id="qty-click3" class="owned">x0</span>
          </div>
        </button>

        <button id="buy-auto3" class="merch-slot" disabled>
          <div class="slot-info">
            <span class="slot-name">Foreuse Antique</span>
            <span class="slot-gain">+90 / sec</span>
          </div>
          <div class="slot-deal">
            <span id="cost-auto3" class="price">5 000</span>
            <span id="qty-auto3" class="owned">x0</span>
          </div>
        </button>

        <!-- OBJET ULTIME LÉGENDAIRE -->
        <button id="buy-relic" class="merch-slot relic-slot" disabled>
          <div class="slot-info">
            <span class="slot-name gold-text">★ BALISE DE NÉTHÉRITE ★</span>
            <span class="slot-gain relic-sub">+6 000/clic &amp; +1 200/sec</span>
          </div>
          <div class="slot-deal">
            <span id="cost-relic" class="price gold-text">1 000 000</span>
            <span id="qty-relic" class="owned">x0</span>
          </div>
        </button>
      </div>
    </footer>
  </div>

  <script src="JavaScript/script.js"></script>
</body>
</html>
