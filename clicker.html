<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouzouc Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/clicker.css">
</head>
<body>
  <div class="mosaic-overlay"></div>

  <header class="masthead">
    <div class="kicker">BOUZOUC WORKSHOP</div>
    <h1>BOUZOUC CLICKER</h1>
    <p class="subtitle">Façonnez les carreaux sacrés, amassez les Zoucs et bâtissez votre domaine.</p>
  </header>

  <main class="forge">
    <div class="meter">
      <div id="counter" class="count">0</div>
      <div class="unit">Zoucs récoltés</div>
      <div id="passive-rate" class="rate">0,0 / sec</div>
    </div>

    <div class="tile-frame">
      <button id="bouzouc" class="bouzouc-btn" aria-label="Frapper le Bouzouc"></button>
    </div>
  </main>

  <footer class="bazaar">
    <div class="bazaar-header">
      <h2>Comptoir des Améliorations</h2>
      <span class="sub-lead">Acquisitions permanentes</span>
    </div>

    <div class="catalog">
      <!-- Article 1 -->
      <button id="buy-click1" class="merch" disabled>
        <div class="merch-meta">
          <span class="merch-name">Petit Tacle</span>
          <span class="merch-gain">+1 Zouc / frappe</span>
        </div>
        <div class="merch-deal">
          <span id="cost-click1" class="price">15</span>
          <span id="qty-click1" class="owned">x0</span>
        </div>
      </button>

      <!-- Article 2 -->
      <button id="buy-auto1" class="merch" disabled>
        <div class="merch-meta">
          <span class="merch-name">Robot Zouc</span>
          <span class="merch-gain">+1 Zouc / sec</span>
        </div>
        <div class="merch-deal">
          <span id="cost-auto1" class="price">30</span>
          <span id="qty-auto1" class="owned">x0</span>
        </div>
      </button>

      <!-- Article 3 -->
      <button id="buy-click2" class="merch" disabled>
        <div class="merch-meta">
          <span class="merch-name">Tibia en Céramique</span>
          <span class="merch-gain">+4 Zoucs / frappe</span>
        </div>
        <div class="merch-deal">
          <span id="cost-click2" class="price">120</span>
          <span id="qty-click2" class="owned">x0</span>
        </div>
      </button>

      <!-- Article 4 -->
      <button id="buy-auto2" class="merch" disabled>
        <div class="merch-meta">
          <span class="merch-name">Peloton de Zoucs</span>
          <span class="merch-gain">+8 Zoucs / sec</span>
        </div>
        <div class="merch-deal">
          <span id="cost-auto2" class="price">350</span>
          <span id="qty-auto2" class="owned">x0</span>
        </div>
      </button>

      <!-- Article 5 -->
      <button id="buy-click3" class="merch" disabled>
        <div class="merch-meta">
          <span class="merch-name">Marathon Émeraude</span>
          <span class="merch-gain">+20 Zoucs / frappe</span>
        </div>
        <div class="merch-deal">
          <span id="cost-click3" class="price">1 000</span>
          <span id="qty-click3" class="owned">x0</span>
        </div>
      </button>

      <!-- Article 6 -->
      <button id="buy-auto3" class="merch" disabled>
        <div class="merch-meta">
          <span class="merch-name">Temple du Bouzouc</span>
          <span class="merch-gain">+50 Zoucs / sec</span>
        </div>
        <div class="merch-deal">
          <span id="cost-auto3" class="price">3 200</span>
          <span id="qty-auto3" class="owned">x0</span>
        </div>
      </button>
    </div>
  </footer>

  <script src="JavaScript/script.js"></script>
</body>
</html>
