<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouzouc Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/abdl.css">
</head>
<body>

  <div class="glow"></div>

  <main class="game-box">
    <h1>Bouzouc Clicker</h1>
    <p>Bienvenue dans le Bouzouc Clicker ! Appuie sur le Bouzouc au milieu, à force de cliquer tu vas pouvoir avoir acheter des bonus et avoir accés à des récompenses !</p>
    <div class="counter-box">
      <div id="counter" class="counter">0</div>
      <div class="counter-label">Zouc Récupérés</div>
    </div>

    <!-- Tête cliquable -->
    <button id="kante" class="kante-btn" aria-label="Cliquer sur Kanté"></button>

    <!-- Message évolutif -->
    <div id="status" class="status-badge">
      Clique pour le faire courir partout ! 🏃💨
    </div>
  </main>

  <script>
    let count = 0;
    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('kante');
    const statusEl = document.getElementById('status');

    // Messages amusants selon la progression
    const perks = [
      { at: 10,  msg: "Il est petit, il est gentil ! 🎶" },
      { at: 30,  msg: "Il a mangé Leo Messi ! 🎶" },
      { at: 60,  msg: "N'Golo Kanté sur tous les ballons !" },
      { at: 100, msg: "70% de la Terre est couverte par l'eau, les 30% restants par Kanté." },
      { at: 200, msg: "Il vient de faire 4 marathons d'affilée en souriant." },
      { at: 500, msg: "Le moteur thermique n'a plus de secret pour lui." },
      { at: 1000, msg: "Légende absolue du football mondial. 🏆" }
    ];

    function createPopNumber(x, y) {
      const el = document.createElement('div');
      el.className = 'pop-number';
      el.textContent = '+1';
      // Petite variation aléatoire d'angle
      const randX = (Math.random() - 0.5) * 40;
      el.style.left = `${x + randX}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 700);
    }

    function handleClick(e) {
      count++;
      counterEl.textContent = count;

      // Micro-animation du compteur
      counterEl.style.transform = 'scale(1.15)';
      setTimeout(() => counterEl.style.transform = 'scale(1)', 60);

      // Coordonnées pour l'effet visuel +1
      const rect = btn.getBoundingClientRect();
      const x = e.clientX || (rect.left + rect.width / 2);
      const y = e.clientY || (rect.top + rect.height / 2);
      createPopNumber(x, y);

      // Vérification des phrases cultes
      for (let i = perks.length - 1; i >= 0; i--) {
        if (count >= perks[i].at) {
          statusEl.textContent = perks[i].msg;
          break;
        }
      }
    }

    btn.addEventListener('pointerdown', handleClick);
  </script>
</body>
</html>
